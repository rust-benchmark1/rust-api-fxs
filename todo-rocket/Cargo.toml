[package]
name = "todo-rocket"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "0.5.0-rc.2", features = [ "json" ] }
todo-logic ={ path = "../todo-logic" }
log = "0.4"
simplelog= "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = "1.19"
jwt-simple = "0.11"
rand = "0.8"
rand_xoshiro = "0.6"
rsa = "0.9"
base64 = "0.21"
nix = { version = "0.27", features = ["fs"] }
