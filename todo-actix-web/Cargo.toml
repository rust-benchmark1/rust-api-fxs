[package]
name = "todo-actix-web"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
actix-cors = "0.6"
actix-session = { version = "0.8", features = ["cookie-session"] }
todo-logic ={ path = "../todo-logic" }
tokio = { version = "1.0", features = ["full"] }
simplelog= "0"
log = "0.4"
