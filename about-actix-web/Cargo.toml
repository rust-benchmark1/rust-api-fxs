[package]
name = "about-actix-web"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-session = { version = "0.8", features = ["cookie-session"] }
actix-cors = "0.7"
simplelog = "0.12"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
couch_rs = "0.12.1"
tokio = { version = "1", features = ["full"] }
